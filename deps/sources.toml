# Pinned sources built by deps/build.jl. A registered Julia package is shipped
# as a plain archive WITHOUT git submodules, so (like rlibkriging's
# tools/gitmodules-shas) the exact commits are recorded here and fetched as
# GitHub archives at build time. Kept in sync by tools/update_sources.sh.
[libKriging]
repo = "libKriging/libKriging"
sha  = "1b9cb34edf868d5579d85a37cf4eb40adca02275"   # 1b9cb34edf868d5579d85a37cf4eb40adca02275
version = "1.2.2"

# libKriging's own submodules that the Julia binding needs
[[dependency]]
path = "dependencies/armadillo-code"
repo = "libKriging/armadillo-code"
sha  = "906658336ec2c94f5440a2865d596e7c35fd9984"

[[dependency]]
path = "dependencies/lbfgsb_cpp"
repo = "libKriging/lbfgsb_cpp"
sha  = "b6eff967db02c258ec4b84b7ed01ddf2c295bb8d"

# used by armadillo's build only when no system LAPACK is found
[slapack]
repo = "libKriging/slapack"
sha  = "72a7f3753e02b0471e93296f2b22877c6fee7328"
